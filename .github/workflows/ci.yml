name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm tsc --noEmit
      # ponytail: payment suites only — the full suite has known stale
      # route-handler tests (Next 16 connection() API). Widen once repaired.
      - run: >
          pnpm vitest run
          __tests__/token-cache.test.ts
          __tests__/callback-guard.test.ts
          __tests__/kcb-client.test.ts
          __tests__/daraja-client.test.ts
          __tests__/dispatch-stk.test.ts
          __tests__/finalize-stk-dispatch.test.ts
          __tests__/instore-mpesa-callback.test.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
